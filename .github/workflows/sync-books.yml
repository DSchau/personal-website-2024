# Adds newly finished books (and rating changes) from public Goodreads pages to
# src/data/books.json and commits the change to main, which deploys the site.
# See scripts/sync-books.mjs.
name: Sync books

on:
  schedule:
    - cron: "17 13 * * *" # daily, early morning Pacific
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-books
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # the script uses only Node built-ins, so no install step
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/sync-books.mjs
      - name: Commit changes
        run: |
          if git diff --quiet src/data/books.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync books from Goodreads" src/data/books.json
          git push
