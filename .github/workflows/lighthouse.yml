# Performance gate: builds the site, runs Lighthouse CI against the prerendered
# pages (budgets in lighthouserc.cjs), and posts the results to the PR. Runs on
# main too, to save a baseline that PRs compare against.
name: Lighthouse

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: write

# One run per PR (or per push to main): a new push cancels the old run, so two
# runs can't race to create the report comment.
concurrency:
  group: lighthouse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The build reaches GitHub for the footer's commit stats; with a dummy
      # token it falls back to placeholders, same as a local build. The
      # contact form's Resend key is only read at runtime, but the build needs
      # it set.
      - run: npm run build
        env:
          GITHUB_TOKEN: dummy
          RESEND_API_KEY: dummy
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
      # The newest summary saved by a run on main. If there isn't one (or it
      # expired), the report just leaves out the comparison.
      - name: Download main baseline
        if: "!cancelled() && github.event_name == 'pull_request'"
        continue-on-error: true
        run: |
          run_id=$(gh api "repos/$REPO/actions/artifacts?name=lighthouse-baseline&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")][0].workflow_run.id // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$REPO" --name lighthouse-baseline --dir baseline
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - name: Summarize results
        if: "!cancelled() && hashFiles('.lighthouseci/lhr-*.json') != ''"
        run: |
          node scripts/lighthouse-summary.mjs --json lighthouse-summary.json --baseline baseline/lighthouse-summary.json > lighthouse-summary.md
          cat lighthouse-summary.md >> "$GITHUB_STEP_SUMMARY"
      # Updates the report comment in place on each push: the summary starts
      # with a hidden marker, so look it up across every page of comments and
      # edit it, and only create one if it doesn't exist yet. PRs from forks get
      # a read-only token, so this can't always comment.
      - name: Comment on PR
        if: "!cancelled() && github.event_name == 'pull_request' && hashFiles('lighthouse-summary.md') != ''"
        continue-on-error: true
        run: |
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- lighthouse-report -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@lighthouse-summary.md --silent
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@lighthouse-summary.md --silent
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
      - name: Save baseline for PRs
        if: "!cancelled() && github.event_name == 'push' && hashFiles('lighthouse-summary.json') != ''"
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-baseline
          path: lighthouse-summary.json
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: "!cancelled() && hashFiles('.lighthouseci/lhr-*.json') != ''"
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
